<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Rozgar Sathi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:linear-gradient(135deg,#075e54,#0b806f);color:white;text-align:center;padding:28px 15px}
nav{background:white;padding:10px;text-align:center;overflow-x:auto;white-space:nowrap;box-shadow:0 2px 7px #ddd}
nav a{display:inline-block;margin:3px;padding:9px 12px;text-decoration:none;color:#075e54;font-weight:bold}
.container{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:20px;margin-top:15px;border-radius:12px;box-shadow:0 2px 8px #ddd}
h2{color:#075e54}
input,textarea{width:100%;padding:12px;margin-top:7px;margin-bottom:12px;border:1px solid #ddd;border-radius:7px;font-size:15px}
button{background:#075e54;color:white;border:0;padding:12px 20px;border-radius:7px;font-weight:bold}
footer{margin-top:30px;background:#222;color:white;text-align:center;padding:25px}
footer a{color:white;text-decoration:none}
</style>
</head>
<body>

<header>
<h1>📩 Contact Us</h1>
<p>Rozgar Sathi से संपर्क करें</p>
</header>

<nav>
<a href="index.html">🏠 Home</a>
<a href="government.html">🏛️ Government</a>
<a href="private.html">🏢 Private</a>

<a href="graduate-jobs.html">🎓 Graduate</a>
<a href="work-from-home.html">🏠 WFH</a>
</nav>

<div class="container">

<div class="card">
<h2>📩 हमसे संपर्क करें</h2>

<p>
Website से संबंधित सुझाव, correction या किसी समस्या
की जानकारी देने के लिए contact करें।
</p>

<form onsubmit="sendMessage(event)">

<label>नाम</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Message</label>
<textarea id="message" rows="6" required></textarea>

<button type="submit">Message भेजें</button>

</form>
</div>

</div>

<footer>
<p><b>© 2026 Rozgar Sathi</b></p>
<p>
<a href="about.html">About Us</a> |
<a href="disclaimer.html">Disclaimer</a>
</p>
</footer>

<script>
function sendMessage(event){
event.preventDefault();

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let message=document.getElementById("message").value;

let subject=encodeURIComponent("Rozgar Sathi Contact");
let body=encodeURIComponent(
"Name: "+name+
"\nEmail: "+email+
"\n\nMessage:\n"+message
);

window.location.href=
"mailto:YOUR-EMAIL@example.com?subject="+subject+"&body="+body;
}
</script>

</body>
