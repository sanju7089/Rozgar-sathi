<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Rozgar Sathi</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}
header{
    background:#075e54;
    color:white;
    text-align:center;
    padding:25px 15px;
}
.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}
.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 2px 8px #ddd;
}
h2{color:#075e54}
input,textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:13px;
    background:#075e54;
    color:white;
    border:0;
    border-radius:7px;
    font-size:16px;
}
.back{
    display:block;
    text-align:center;
    margin:20px 0;
    color:#075e54;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>📞 Contact Us</h1>
<p>Rozgar Sathi</p>
</header>

<div class="container">

<div class="card">
<h2>📩 हमसे संपर्क करें</h2>

<p>
अगर आपको किसी job की जानकारी में कोई गलती दिखाई दे,
या किसी link के बारे में बताना हो, तो आप हमें message भेज सकते हैं।
</p>

<form action="mailto:YOUR-EMAIL@example.com" method="post" enctype="text/plain">

<input type="text" name="name" placeholder="आपका नाम" required>

<input type="email" name="email" placeholder="आपका Email" required>

<textarea name="message" rows="6" placeholder="आपका संदेश" required></textarea>

<button type="submit">Message भेजें</button>

</form>

</div>

<a class="back" href="index.html">🏠 Home पर वापस जाएँ</a>

</div>

</body>
</html>
