<script>

/* =========================================
   ROZGAR SATHI SMART SEARCH ENGINE
   ========================================= */

const searchBox = document.getElementById("jobSearch");
const noResult = document.getElementById("noResult");

let searchTimer = null;


/* -----------------------------------------
   TEXT NORMALIZATION
----------------------------------------- */

function normalizeText(text){

    return text
        .toLowerCase()

        // Hindi punctuation / symbols
        .replace(/[।,!?;:'"(){}\[\]<>\/\\|@#$%^&*+=_~`-]/g," ")

        // Common Hindi variations
        .replace(/नौकरी/g,"job")
        .replace(/नौकरियां/g,"job")
        .replace(/भर्ती/g,"recruitment")
        .replace(/सरकारी/g,"government")
        .replace(/सरकार/g,"government")
        .replace(/दसवीं/g,"10th")
        .replace(/दसवी/g,"10th")
        .replace(/बारहवीं/g,"12th")
        .replace(/बारहवी/g,"12th")
        .replace(/ग्रेजुएट/g,"graduate")
        .replace(/स्नातक/g,"graduate")
        .replace(/घर से काम/g,"work from home")
        .replace(/घर से/g,"work from home")
        .replace(/प्राइवेट/g,"private")
        .replace(/सरकारी बैंक/g,"government bank")
        .replace(/रेलवे/g,"railway")
        .replace(/बैंक/g,"bank")

        .replace(/\s+/g," ")
        .trim();
}


/* -----------------------------------------
   COMMON SEARCH WORDS / SYNONYMS
----------------------------------------- */

const synonyms = {

    "govt":["government","sarkari","सरकारी"],
    "sarkari":["government","govt","सरकारी"],

    "job":["jobs","vacancy","recruitment","नौकरी","भर्ती"],
    "jobs":["job","vacancy","recruitment"],

    "rail":["railway","rrb","रेलवे"],
    "railway":["rrb","rail","रेलवे"],
    "rrb":["railway","rail"],

    "bank":["banking","बैंक"],
    "banking":["bank"],

    "ssc":["staff selection commission"],
    "chsl":["ssc","12th"],
    "cgl":["ssc","graduate"],

    "10":["10th","10वीं","tenth"],
    "tenth":["10th","10वीं"],

    "12":["12th","12वीं","twelfth"],
    "twelfth":["12th","12वीं"],

    "graduate":["graduation","degree","स्नातक"],
    "graduation":["graduate","degree"],

    "wfh":["work from home","remote","घर से काम"],
    "remote":["wfh","work from home"],

    "private":["company","corporate","प्राइवेट"],

    "police":["constable","sipahi","पुलिस"],
    "constable":["police"],

    "teacher":["teaching","school","शिक्षक"],
    "teaching":["teacher"],

    "clerk":["office","assistant"],
    "assistant":["clerk","office"],

    "iti":["technical","technician"],
    "diploma":["technical"],

    "fresher":["freshers","new candidate"],
    "freshers":["fresher"]
};


/* -----------------------------------------
   LEVENSHTEIN FUZZY MATCH
   Typing mistakes को समझेगा
----------------------------------------- */

function levenshtein(a,b){

    if(a === b) return 0;

    if(!a.length) return b.length;
    if(!b.length) return a.length;

    let matrix = [];

    for(let i=0;i<=b.length;i++){
        matrix[i] = [i];
    }

    for(let j=0;j<=a.length;j++){
        matrix[0][j] = j;
    }

    for(let i=1;i<=b.length;i++){

        for(let j=1;j<=a.length;j++){

            if(b.charAt(i-1) === a.charAt(j-1)){

                matrix[i][j] = matrix[i-1][j-1];

            }else{

                matrix[i][j] = Math.min(

                    matrix[i-1][j-1] + 1,
                    matrix[i][j-1] + 1,
                    matrix[i-1][j] + 1

                );

            }

        }

    }

    return matrix[b.length][a.length];
}


/* -----------------------------------------
   TOKENIZE
----------------------------------------- */

function getWords(text){

    return normalizeText(text)
        .split(/\s+/)
        .filter(word => word.length > 0);

}


/* -----------------------------------------
   WORD MATCH
----------------------------------------- */

function wordMatches(queryWord, textWords){

    if(!queryWord) return false;

    for(let word of textWords){

        // Exact
        if(word === queryWord){
            return true;
        }

        // Starts with
        if(word.startsWith(queryWord)){
            return true;
        }

        // Query starts with database word
        if(queryWord.startsWith(word) && word.length >= 3){
            return true;
        }

        // Small spelling mistake
        if(queryWord.length >= 4 && word.length >= 4){

            let distance = levenshtein(queryWord,word);

            let allowed = queryWord.length >= 7 ? 2 : 1;

            if(distance <= allowed){
                return true;
            }

        }

    }

    return false;
}


/* -----------------------------------------
   SEARCH SCORE
----------------------------------------- */

function calculateScore(query, job){

    const normalizedQuery = normalizeText(query);

    const normalizedJob = normalizeText(

        job.innerText + " " +
        (job.dataset.search || "")

    );

    const queryWords = getWords(normalizedQuery);
    const jobWords = getWords(normalizedJob);

    if(!queryWords.length) return 1;

    let score = 0;

    /* Exact complete phrase */

    if(normalizedJob.includes(normalizedQuery)){
        score += 100;
    }


    /* Every search word */

    queryWords.forEach(queryWord => {

        if(wordMatches(queryWord,jobWords)){
            score += 20;
        }


        /* Synonyms */

        if(synonyms[queryWord]){

            synonyms[queryWord].forEach(synonym => {

                const syn = normalizeText(synonym);

                if(normalizedJob.includes(syn)){
                    score += 15;
                }

            });

        }

    });


    /* Title gets extra priority */

    const title =
        job.querySelector("h3");

    if(title){

        const titleText =
            normalizeText(title.innerText);

        queryWords.forEach(word => {

            if(titleText.includes(word)){
                score += 35;
            }

        });

    }


    return score;
}


/* -----------------------------------------
   SMART SEARCH
----------------------------------------- */

function searchJobs(){

    clearTimeout(searchTimer);

    searchTimer = setTimeout(function(){

        const input =
            searchBox.value.trim();

        const jobs =
            Array.from(
                document.querySelectorAll(".searchable")
            );

        /* Empty search */

        if(input === ""){

            jobs.forEach(job => {

                job.style.display = "";

                job.style.order = "";

            });

            noResult.style.display = "none";

            return;

        }


        let results = [];


        jobs.forEach(function(job){

            const score =
                calculateScore(input,job);

            if(score > 0){

                results.push({
                    element:job,
                    score:score
                });

            }else{

                job.style.display = "none";

            }

        });


        /* Highest relevance first */

        results.sort(function(a,b){

            return b.score - a.score;

        });


        /* Show results */

        results.forEach(function(result,index){

            result.element.style.display = "block";

            /*
            Search result को ऊपर लाने के लिए
            order इस्तेमाल किया जा रहा है।
            */

            result.element.style.order = index;

        });


        /* No result */

        if(results.length === 0){

            noResult.style.display = "block";

            noResult.innerHTML = `

                <h3>😔 कोई Job नहीं मिली</h3>

                <p>
                <b>${input}</b> के लिए अभी कोई matching
                job नहीं मिली।
                </p>

                <p>
                दूसरा keyword try करें जैसे:
                SSC, Railway, Bank, 10th, 12th,
                Graduate, WFH, Police
                </p>

            `;

        }else{

            noResult.style.display = "none";

        }

    },50);

}


/* -----------------------------------------
   INSTANT SEARCH
----------------------------------------- */

if(searchBox){

    searchBox.addEventListener(
        "input",
        searchJobs
    );

    searchBox.addEventListener(
        "keyup",
        searchJobs
    );

}


/* -----------------------------------------
   ENTER KEY
----------------------------------------- */

if(searchBox){

    searchBox.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                searchJobs();

                event.preventDefault();

            }

        }
    );

}


/* -----------------------------------------
   CLEAR SEARCH WITH ESC
----------------------------------------- */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            document.activeElement === searchBox
        ){

            searchBox.value = "";

            searchJobs();

        }

    }
);

        </script>
